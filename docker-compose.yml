services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vbook-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 把容器内路径固化下来
      DATABASE_URL: sqlite:////app/data/vbook.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    # 小程序 / H5 / 第三方客户端直接访问后端，需对外发布端口。
    # 生产请置于反向代理（HTTPS + 已备案域名）之后，供小程序「服务器域名」白名单使用。
    ports:
      - "6627:6627"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6627/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # H5 网站容器（当前主交付物；uni-app 同一份源码既能编 H5 也能编小程序）
  # - 对外暴露 6628:6628（直接用 6628 而非 80，省去 80 端口权限问题）
  # - 容器内 nginx 把 /api/ 与 /uploads/ 反代到 backend:6627
  # - 构建期注入 VITE_API_HOST=http://localhost:6627，方便 H5 直连后端联调
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.h5
    container_name: vbook-frontend-h5
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "6628:6628"

volumes:
  backend_data:
  backend_uploads:
