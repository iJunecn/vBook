apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: vbook, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      # Force replicas across failure domains: if the ty1 group dies, ty4 still serves.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: web } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: web } }
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000               # the `node` user in node:22-alpine
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/ijunecn/vbook:latest   # CI overwrites this with the commit SHA
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # Connection string is generated + rotated by CloudNativePG (vbook-db-app).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: vbook-db-app, key: uri }
          envFrom:
            # AGNES_API_KEY / AGNES_BASE_URL — CI-managed from GitHub secrets.
            - secretRef: { name: vbook-secrets }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: vbook }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: vbook
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ebook.ustb.world]
      secretName: web-tls
  rules:
    - host: ebook.ustb.world
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
