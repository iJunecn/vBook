# Pre-roll Drizzle migration Job. Same image as the app; the command is overridden
# to run `drizzle-kit migrate` against the CNPG database BEFORE the new app rolls out.
# CI substitutes __IMAGE__ with ghcr.io/jianyuelab/vbook:<sha>, deletes any prior Job,
# applies this, and waits for completion (see .github/workflows/deploy.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: vbook-migrate
  namespace: vbook
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600        # auto-clean 10 min after finishing
  template:
    metadata: { labels: { app: vbook-migrate } }
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: __IMAGE__
          command: ["node_modules/.bin/drizzle-kit", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: vbook-db-app, key: uri }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
