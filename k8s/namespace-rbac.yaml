# One-time, applied with the ADMIN kubeconfig (KUBECONFIG=../k8s/kubeconfig).
# Creates the app namespace and grants the shared `deployer` SA (in the `web`
# namespace) the cluster-wide `app-deployer` ClusterRole, scoped to this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: vbook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: vbook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-deployer        # pre-existing global ClusterRole
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: web          # reuse the existing deployer SA / KUBECONFIG_B64
