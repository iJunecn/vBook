name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ijunecn/vbook
  NS: vbook

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ebook.ustb.world
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to cluster
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config

          # Private GHCR pull secret (image stays private).
          kubectl -n "$NS" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Runtime app secrets (AI endpoint). DATABASE_URL comes from CNPG vbook-db-app.
          kubectl -n "$NS" create secret generic vbook-secrets \
            --from-literal=AGNES_API_KEY="$AGNES_API_KEY" \
            --from-literal=AGNES_BASE_URL="$AGNES_BASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Run DB migrations to completion BEFORE rolling out the new app.
          kubectl -n "$NS" delete job vbook-migrate --ignore-not-found
          sed "s|__IMAGE__|${IMAGE}:${GITHUB_SHA}|" k8s/migrate-job.yaml | kubectl -n "$NS" apply -f -
          if ! kubectl -n "$NS" wait --for=condition=complete job/vbook-migrate --timeout=180s; then
            echo "::error::migration job did not complete"
            kubectl -n "$NS" logs job/vbook-migrate --all-containers --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs job/vbook-migrate --tail=50 || true

          # Roll out the app.
          kubectl -n "$NS" apply -f k8s/app.yaml
          kubectl -n "$NS" set image deployment/web web="${IMAGE}:${GITHUB_SHA}"
          kubectl -n "$NS" rollout status deployment/web --timeout=180s
