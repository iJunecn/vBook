server {
    listen 6628;
    server_name _;

    # uni-app 打包后的 H5 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：所有未知路径都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理：H5 浏览器直接访问 /api 与 /uploads 时，转发到后端容器
    # （H5 容器和后端在同一 docker network 时，用服务名 `backend`）
    location /api/ {
        proxy_pass http://backend:6627;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend:6627;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 上传图片体积限制跟随后端
    client_max_body_size 25m;
}
